faq:
  title: Frequently Asked Questions
  description: Common questions about my senior technical leadership, system architecture, and full-stack engineering experience.
  categories:
    - title: Skills & Architecture Expertise
      questions:
        - label: What technologies do you specialise in?
          content: |
            My core specialty is architecting enterprise-grade applications using the Java/Spring ecosystem (Spring Boot, Jakarta EE, FastAPI) on the backend, paired with modern TypeScript frontends like Nuxt (Vue) or Angular, backed by PostgreSQL/MySQL relational databases and Apache Artemis message queues for event-driven processing. I also build high-performance mobile systems (Flutter, native Kotlin/Swift), maintain Python telemetry scripts for IoT deployments, and orchestrate CI/CD pipelines across AWS, DigitalOcean, Docker, and Kubernetes on bare-metal and virtual Linux environments.
        - label: Do you design full system architectures?
          content: |
            Yes. Beyond full-stack development, I function as a Solutions Architect. I design scalable multi-tenant ledger systems, secure identity and access control models using Keycloak and OAuth 2.0 protocols, robust API contracts, and high-availability database schemas optimized for low-latency transaction handling.
        - label: Have you worked with IoT or hardware integrations?
          content: |
            Yes. Leveraging my BSc in Mechatronics Engineering, I specialize in bridging hardware-software gaps. My portfolio includes production-grade IoT systems, such as programming custom Python firmware on Raspberry Pi edge devices to drive real-time solenoid lock automation, and building complex RFID-based tracking networks integrated into cloud ecosystems.
    - title: Experience & Delivery
      questions:
        - label: What scale of projects have you managed?
          content: |
            I have architected, launched, and continuously upgraded full-scale B2B multi-tenant enterprise platforms, automated transactional bulk messaging networks spanning international markets, and secure property technology automation solutions. I have an established track record driving end-to-end products from initial concept prototyping straight to stable production environments.
        - label: What does your technical delivery process look like?
          content: |
            I treat operations and engineering holistically. My workflow covers technical requirements gathering, rigorous database and architectural modeling, secure-by-design authentication setups, continuous automated test pipelines via CI/CD pipelines, and high-availability deployments onto Linux infrastructures. I enforce strict clean architecture principles to ensure long-term code maintainability.
        - label: Are you available for consulting or corporate contracts?
          content: |
            Yes. I accept senior contract roles, technical consulting engagements, and end-to-end system delivery for clients globally, with active project footprints across Kenya and Mexico. Please reach out directly via email at ewomondi@gmail.com to discuss project scopes.
    - title: Background & Professional Focus
      questions:
        - label: How does your engineering background shape your software approach?
          content: |
            I hold a BSc in Mechatronics Engineering from JKUAT (graduating with Upper Second Class Honours). This multidisciplinary training across electrical, mechanical, and software nodes enables me to analyze distributed systems holistically, troubleshoot hardware-to-cloud network heartbeats effectively, and design highly deterministic software architectures.
        - label: What drives your work as an engineer?
          content: |
            I excel at translating complex business requirements into high-performance, resilient code bases. Shipping secure, highly available products—whether that is an enterprise gift card ledger or an automated remote access engine—that reliably solve tangible engineering and operational bottlenecks is what I enjoy most.
        - label: Do you have specialized training in security or systems?
          content: |
            Yes. I maintain a deep focus on security hardening and systems administration. I hold a Certified Ethical Hacker (CEH) certification from the EC-Council, completed an Introduction to Cyber Security certification with Cisco, and continuously audit systems against modern authentication and vulnerability management standards.