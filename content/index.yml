about:
  title: "About Me"
  description: |
    Full-Stack Software Engineer and Solutions Architect with 5+ years of experience designing, building, and maintaining production web and mobile applications across the Java/Spring, Vue/Nuxt, and Angular ecosystems. I've co-founded and architected two live SaaS platforms, integrating secure OAuth 2.0/Keycloak authentication and event-driven architectures with Apache Artemis. My Mechatronics Engineering background lets me own hardware-connected IoT systems end-to-end — from REST APIs to Raspberry Pi controllers.
